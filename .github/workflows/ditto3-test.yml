name: Ditto3 Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ditto3-test.yml"
      - "Ditto3/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ditto3-test.yml"
      - "Ditto3/**"

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          working_directory: Ditto3

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: Ditto3
          bundler-cache: true

      - name: Show tool versions
        working-directory: Ditto3
        run: |
          xcodebuild -version
          mise --version
          bundle --version

      - name: Generate Tuist workspace
        working-directory: Ditto3
        run: ./tuist-generate.sh --clean

      - name: Run tests
        working-directory: Ditto3
        run: bundle exec fastlane ios test
